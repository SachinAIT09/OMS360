<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMS360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ground:#040a1f; --card:#08122f; --panel:#0a132f; --tile:#0c1636;
  --hdr:linear-gradient(90deg,#0b1740,#122055);
  --bd:#1c2c60; --bd2:#16234f; --rule:#14204a; --outline:#24356e; --dash:#17244d;
  --t1:#eaf0ff; --t2:#e3e9fb; --t3:#8a96c0; --t4:#7c88b2; --lbl:#5d6a94; --faint:#3f4c78; --faint2:#4d5a86;
  --blue:#2b6bff; --blue2:#6f9dff; --bluefill:#1c3f8f; --bluedim:#12224f; --bluehov:#a9c4ff;
  --pur:#7c5cf0; --pur2:#c3b1ff; --pur3:#dcd2ff; --purbd:#2a2260; --purtrack:#1b1a44; --purfill:rgba(124,92,240,.12);
  --amber:#f5a623; --amber2:#f0d7a8; --amberbd:#5b3a12; --amberfill:rgba(245,166,35,.1);
  --orange:#f07a2e;
  --green:#3ec46d; --greenfill:rgba(62,196,109,.1);
  --red:#e0506a; --redbd:#6d1f2c; --redfill:rgba(224,80,106,.12);
  --sb:226px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);font-family:Poppins,system-ui,sans-serif;color:var(--t2);-webkit-font-smoothing:antialiased}
a{color:var(--blue2);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--ground)}
::-webkit-scrollbar-thumb{background:#1c2c60;border-radius:5px}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sb);flex:none;background:var(--panel);border-right:1px solid var(--bd2);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:1200}
.main{margin-left:var(--sb);flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:18px 24px 40px;max-width:1600px;width:100%}

.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 13px;border-bottom:1px solid var(--bd2)}
.brand img{height:30px;max-width:110px;object-fit:contain;background:#fff;border-radius:6px;padding:3px 6px}
.brand-name{font:600 16px Poppins,sans-serif;color:var(--t1);letter-spacing:.02em}
.brand-name span{color:var(--blue2)}
.brand-sub{font:300 9px Poppins,sans-serif;color:var(--t4);letter-spacing:.06em}
.nav{flex:1;overflow-y:auto;padding:10px}
.nav-label{font:500 9.5px Poppins,sans-serif;color:var(--lbl);letter-spacing:.14em;text-transform:uppercase;padding:10px 8px 7px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;cursor:pointer;font:400 12px Poppins,sans-serif;color:var(--t3);padding:8px 10px;border-radius:7px;margin-bottom:2px}
.nav-item:hover{background:#0c1636;color:var(--t2)}
.nav-item.on{background:var(--blue);color:#fff;font-weight:500}
.nav-item.jv{color:var(--pur2)}
.nav-item.jv.on{background:var(--pur);color:#fff}
.ic{width:15px;height:15px;flex:none;opacity:.85}
.count{margin-left:auto;font:600 9.5px Poppins,sans-serif;color:#ffd4dc;background:var(--redfill);border:1px solid var(--redbd);border-radius:10px;padding:1px 6px}
.nav-item.on .count{background:rgba(255,255,255,.2);border-color:transparent;color:#fff}
.sb-foot{border-top:1px solid var(--bd2);padding:11px 12px}
.sb-user{display:flex;align-items:center;gap:9px}
.sb-org{display:flex;align-items:center;gap:8px;margin-top:10px;padding:7px 9px;border:1px solid var(--outline);border-radius:7px;background:var(--tile)}

.topbar{position:sticky;top:0;z-index:1100;background:var(--hdr);border-bottom:1px solid var(--bd)}
.topbar-row{padding:11px 24px;display:flex;align-items:center;gap:14px}
.topbar h1{font:600 17px Poppins,sans-serif;color:var(--t1);margin:0}
.topbar .sub{font:300 11px Poppins,sans-serif;color:var(--t3);margin-top:2px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.timeline{display:flex;align-items:center;gap:0;padding:0 24px 11px}
.tl-step{flex:1;position:relative;background:none;border:0;cursor:pointer;padding:0 4px;text-align:left}
.tl-bar{height:5px;border-radius:3px;background:var(--bd2)}
.tl-step.done .tl-bar{background:var(--blue2)}
.tl-step.on .tl-bar{background:var(--amber);box-shadow:0 0 10px rgba(245,166,35,.6)}
.tl-lbl{font:500 10px Poppins,sans-serif;color:var(--t4);margin-top:5px;display:flex;gap:6px}
.tl-lbl b{font-weight:600;color:var(--t3)}
.tl-step.on .tl-lbl,.tl-step.on .tl-lbl b{color:var(--amber2)}
.tl-step:hover .tl-lbl{color:var(--t2)}
.simtag{font:600 9px Poppins,sans-serif;letter-spacing:.12em;color:var(--amber2);border:1px dashed var(--amber);border-radius:4px;padding:3px 7px;text-transform:uppercase}
.livetag{font:600 9px Poppins,sans-serif;letter-spacing:.1em;color:#bff0d0;border:1px solid rgba(62,196,109,.4);background:var(--greenfill);border-radius:4px;padding:3px 7px;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.livetag i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.avatar{width:28px;height:28px;border-radius:50%;background:var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font:600 9.5px Poppins,sans-serif;color:#cfdcff}
.btn{font:400 11px Poppins,sans-serif;color:var(--t3);background:none;border:1px solid var(--outline);border-radius:6px;padding:6px 13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#2b4a9e;color:var(--t2)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn-primary:hover{background:#1a5aef;color:#fff}
.btn-ai{background:var(--purfill);border-color:var(--pur);color:var(--pur3);font-weight:500}
.btn-ai:hover{background:rgba(124,92,240,.25);color:#fff}
.btn-warn{background:var(--amberfill);border-color:var(--amber);color:var(--amber2);font-weight:500}
.btn-ok{background:var(--greenfill);border-color:rgba(62,196,109,.5);color:#bff0d0}
.btn-sm{padding:4px 10px;font-size:10.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.panel{background:var(--panel);border:1px solid var(--bd2);border-radius:10px}
.tile{background:var(--tile);border:1px solid var(--bd2);border-radius:9px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd2);flex-wrap:wrap}
.card-h h3{font:500 12.5px Poppins,sans-serif;color:var(--t2);margin:0}
.card-h .hint{font:300 10.5px Poppins,sans-serif;color:var(--lbl)}
.card-b{padding:14px 16px}
.sec-label{font:500 10px Poppins,sans-serif;color:var(--lbl);letter-spacing:.14em;text-transform:uppercase}
.muted{color:var(--t4)} .dim{color:var(--lbl)}
.num{font:600 22px Poppins,sans-serif;color:var(--t1);line-height:1.1}
.num-sm{font:600 15px Poppins,sans-serif;color:var(--t1)}
.pos{color:var(--green)}.neg{color:var(--red)}.warnc{color:var(--amber2)}.aic{color:var(--pur2)}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}
.kpi{padding:12px 14px}
.kpi .k{font:400 9.5px Poppins,sans-serif;color:var(--t4);letter-spacing:.1em;text-transform:uppercase}
.kpi .v{margin-top:6px}
.kpi .s{font:300 10px Poppins,sans-serif;color:var(--t4);margin-top:3px}
.kpi.clickable{cursor:pointer}.kpi.clickable:hover{border-color:#2b4a9e}

.meter{height:6px;border-radius:3px;background:var(--bd2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:3px;background:var(--green)}

table.tbl{width:100%;border-collapse:collapse}
.tbl th{font:500 9.5px Poppins,sans-serif;color:var(--lbl);letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd2);white-space:nowrap}
.tbl td{font:400 11.5px Poppins,sans-serif;color:var(--t2);padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#0a1430}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}

.tag{font:500 9.5px Poppins,sans-serif;border-radius:4px;padding:3px 7px;display:inline-block;white-space:nowrap}
.tag-ai{color:var(--pur2);background:var(--purfill);border:1px dashed var(--pur)}
.tag-sk{color:var(--t3);border:1px solid var(--outline)}
.tag-ok{color:var(--green);background:var(--greenfill);border:1px solid rgba(62,196,109,.3)}
.tag-warn{color:var(--amber2);background:var(--amberfill);border:1px solid var(--amberbd)}
.tag-bad{color:#ffd4dc;background:var(--redfill);border:1px solid var(--redbd)}
.tag-info{color:#cfdcff;background:var(--bluedim);border:1px solid var(--outline)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}

.ai-panel{border:1px solid var(--purbd);border-radius:10px;background:rgba(124,92,240,.07)}
.ai-glyph{width:26px;height:26px;border-radius:7px;background:rgba(124,92,240,.3);border:1px solid var(--pur);flex:none;display:flex;align-items:center;justify-content:center;color:var(--pur3)}
.why{margin-top:8px;border-top:1px dashed var(--purbd);padding-top:8px}
.why summary{font:400 10.5px Poppins,sans-serif;color:var(--pur2);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"?";display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;border:1px solid var(--pur);font:600 8px Poppins,sans-serif;flex:none}
.why[open] summary{margin-bottom:6px}
.why p{margin:0;font:300 10.5px/1.7 Poppins,sans-serif;color:var(--t3)}

.action{border:1px solid var(--bd2);border-left:3px solid var(--amber);border-radius:9px;background:var(--tile);padding:11px 13px}
.action.Critical{border-left-color:var(--red)}
.action.done{border-left-color:var(--green);opacity:.62}

.field{width:100%;background:var(--tile);border:1px solid var(--outline);border-radius:8px;padding:10px 12px;font:400 12px Poppins,sans-serif;color:var(--t2);outline:none}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,107,255,.14)}
.field::placeholder{color:var(--faint2)}
select.field{cursor:pointer;padding:7px 10px;font-size:11.5px;width:auto}
select.field option{background:#0c1636}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,#3ec46d,#f5a623,#e0506a);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--pur);cursor:pointer}

.switch{position:relative;width:34px;height:19px;border-radius:12px;background:var(--bd);border:1px solid var(--outline);cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--t4);transition:.2s}
.switch.on{background:var(--green);border-color:var(--green)}
.switch.on::after{left:17px;background:#fff}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font:300 10px Poppins,sans-serif;color:var(--t4)}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block}
.empty{padding:30px;text-align:center;font:300 12px Poppins,sans-serif;color:var(--faint2)}

/* map */
.map{height:430px;border-radius:0;background:#071027;position:relative}
.leaflet-container{background:#071027;font-family:Poppins,sans-serif}
.osm-dark{filter:invert(1) hue-rotate(200deg) brightness(.75) contrast(.9)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0c1636;color:var(--t2);border:1px solid var(--outline);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.leaflet-popup-content{margin:10px 12px;font:400 11px/1.6 Poppins,sans-serif}
.leaflet-popup-content b{color:var(--t1)}
.leaflet-control-attribution{background:rgba(4,10,31,.7)!important;color:var(--faint2)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--t4)!important}
.leaflet-bar a{background:#0c1636;color:var(--t2);border-color:var(--outline)}
.leaflet-bar a:hover{background:#12224f}
.leaflet-tooltip.zlabel{background:none;border:0;box-shadow:none;color:#eaf0ff;font:500 10px Poppins,sans-serif;text-shadow:0 1px 3px #000,0 0 6px #000;padding:0}
.leaflet-tooltip.zlabel::before{display:none}
.hurr{font-size:30px;line-height:30px;text-align:center;animation:spin 3s linear infinite;filter:drop-shadow(0 0 8px rgba(255,255,255,.6))}
@keyframes spin{to{transform:rotate(-360deg)}}
.fac{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font:700 10px Poppins,sans-serif;color:#fff;border:1.5px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.8)}
.map-legend{position:absolute;left:10px;bottom:10px;z-index:500;background:rgba(8,18,47,.88);border:1px solid var(--outline);border-radius:8px;padding:7px 10px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font:400 12px/1.65 Poppins,sans-serif}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.ai{align-self:flex-start;background:rgba(124,92,240,.12);border:1px solid var(--purbd);color:var(--t2);border-bottom-left-radius:3px}
.msg.ai b{color:var(--pur3)}
.msg ul{margin:6px 0 0;padding-left:18px}
.msg .act{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--pur);background:var(--purfill);color:var(--pur3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.mic.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}
.orb{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c3b1ff,#7c5cf0 45%,#1b1a44 75%);box-shadow:0 0 34px rgba(124,92,240,.6),inset 0 0 18px rgba(255,255,255,.25);animation:breathe 3.2s ease-in-out infinite;flex:none}
.orb.talk{animation:breathe .5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.qp{font:400 11px Poppins,sans-serif;color:var(--pur3);padding:6px 11px;border:1px dashed var(--pur);border-radius:16px;cursor:pointer;background:none;white-space:nowrap}
.qp:hover{background:var(--purfill)}

/* comms */
.chcard{border:1px solid var(--bd2);border-radius:10px;background:var(--tile);padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.chcard .txt{font:400 11.5px/1.65 Poppins,sans-serif;color:var(--t2);white-space:pre-wrap;background:#081230;border:1px solid var(--rule);border-radius:7px;padding:9px 10px}
.chico{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 11px Poppins,sans-serif;color:#fff;flex:none}

/* portal (customer-facing light theme) */
.browser{border-radius:12px;overflow:hidden;border:1px solid var(--outline);background:#fff}
.browser-bar{background:#e8ebf2;padding:8px 12px;display:flex;align-items:center;gap:8px}
.browser-bar i{width:10px;height:10px;border-radius:50%;display:inline-block}
.browser-url{flex:1;background:#fff;border-radius:6px;padding:5px 10px;font:400 11px Poppins,sans-serif;color:#555}
.pt{color:#1b2440;font-family:Poppins,sans-serif}
.pt-hdr{background:#0b3d91;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px}
.pt-banner{padding:10px 22px;font:500 12px Poppins,sans-serif}
.pt-body{padding:18px 22px;display:grid;grid-template-columns:1fr 1.2fr;gap:18px}
.pt-card{border:1px solid #dde3ef;border-radius:10px;padding:14px 16px;background:#fff}
.pt input{width:100%;padding:10px 12px;border:1px solid #c6cfe1;border-radius:8px;font:400 12.5px Poppins,sans-serif;color:#1b2440}
.pt-btn{background:#0b3d91;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:500 12px Poppins,sans-serif;cursor:pointer}
.pt .map{height:330px;border-radius:10px}

.toast{position:fixed;right:22px;bottom:22px;z-index:3000;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast>div{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--green);border-radius:9px;padding:11px 15px;box-shadow:0 14px 34px rgba(0,0,0,.6);font:400 11.5px Poppins,sans-serif;color:var(--t2);max-width:400px;animation:slide .28s ease}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr}.row.wrap{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="https://d7umqicpi7263.cloudfront.net/img/product/f93e9a80-bf37-4444-9934-14f54d16daef.com/3b20a3af2ab95662337f13eca910ef71" alt="PowerConnect" onerror="this.style.display='none'">
      <div>
        <div class="brand-name">OMS<span>360</span></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="avatar">DW</div>
        <div style="flex:1;min-width:0">
          <div style="font:500 11.5px Poppins,sans-serif;color:var(--t2)">Dana Whitaker</div>
          <div style="font:300 9.5px Poppins,sans-serif;color:var(--t4)">VP, Storm Operations</div>
        </div>
      </div>
      <div class="sb-org">
        <div style="width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#2b6bff,#3ec46d);flex:none"></div>
        <div style="flex:1;min-width:0">
          <div style="font:500 10.5px Poppins,sans-serif;color:var(--t2)">Bayview Power &amp; Water</div>
          <div style="font:300 9px Poppins,sans-serif;color:var(--t4)">Hillsborough County, FL</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-row">
        <div style="min-width:0">
          <h1 id="pgTitle">Command Center</h1>
          <div class="sub" id="pgSub"></div>
        </div>
        <div class="topbar-actions">
          <span class="livetag" id="wxTag" title="Live weather feed"><i></i><span id="wxTagTxt">Live weather…</span></span>
          <span class="simtag" title="Hurricane Kyle is a simulated storm for this demo">Simulation · Hurricane Kyle</span>
          <button class="btn btn-warn" id="playBtn">▶ Play storm</button>
          <button class="btn btn-ai" data-nav="jarvis">✦ Ask Jarvis</button>
        </div>
      </div>
      <div class="timeline" id="timeline"></div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   OMS360 prototype
   Single file, no build step. Map: Leaflet (cdnjs). Weather: live
   OpenWeather (with key) or Open-Meteo (keyless). Storm is simulated.
   =================================================================== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const pct = (n, d=0) => (n*100).toFixed(d) + '%';
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const stripTags = h => h.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },

function toast(msg, kind='ok'){
  const el = document.createElement('div');
  el.style.borderLeftColor = {ok:'var(--green)', ai:'var(--pur)', bad:'var(--red)', info:'var(--blue)', warn:'var(--amber)'}[kind];
  el.innerHTML = msg;
  $('#toast').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 320); }, 4200);
}

   =================================================================== */
const addH = (d, h) => new Date(Math.round((d.getTime() + h*3600e3)/1.8e6)*1.8e6);
const fmtDT = d => d.toLocaleString('en-US', {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});

function stormNow(){
  const p = S.phase;
  if(p === 0) { const c = Math.max(1, S.cat-1); return {cat:c, wind:WIND_BY_CAT[c], press:978-c*5, label:'Category '+c, dist:'410 mi SSW of Tampa Bay', move:'NNE at 12 mph'}; }
  if(p === 1) return {cat:S.cat, wind:WIND_BY_CAT[S.cat], press:975-S.cat*8, label:'Category '+S.cat, dist:'125 mi SW of Tampa Bay', move:'NE at 14 mph'};
  if(p === 2) return {cat:S.cat, wind:WIND_BY_CAT[S.cat], press:976-S.cat*8, label:'Category '+S.cat+' — landfall', dist:'Mouth of Tampa Bay', move:'NE at 15 mph'};
  if(p === 3) return {cat:0, wind:50, press:994, label:'Tropical Storm', dist:'Inland, 95 mi NE', move:'NE at 18 mph'};
  return {cat:-1, wind:0, press:1012, label:'Post-tropical', dist:'Off the Atlantic coast', move:'—'};
}

function M(catOverride){
  const cat = catOverride || S.cat, cf = CATF[cat], ph = PH[S.phase], hs = ph.h;
  const zs = ZONES.map(z => ({z, pred: Math.round(z.cust * Math.min(.97, cf*z.vuln*1.15))}));
  const predTotal = sum(zs, o=>o.pred);
  const reqLine = Math.round(predTotal/185), reqTree = Math.round(reqLine*.45), reqDA = Math.max(20, Math.round(predTotal/2500));
  const INT = {line:640, tree:180, da:40};
  const mutualReq = Math.max(0, Math.round(reqLine*1.08) - INT.line);
  const treeReq = Math.max(0, Math.round(reqTree*1.05) - INT.tree);
  const daReq = Math.max(0, reqDA - INT.da);
  const ma = S.approved.has('mutual');
  const frac = ma ? [0,.62,.97,1,.45][S.phase] : [0,0,.12,.22,.1][S.phase];
  const onLine = INT.line + Math.round(mutualReq*frac);
  const onTree = INT.tree + Math.round(treeReq*frac);
  const onDA = INT.da + Math.round(daReq*(ma?Math.min(1,frac+.2):frac));
  const planLine = S.phase < 2 ? INT.line + (ma ? mutualReq : 0) : onLine;
  const ratio = Math.min(1.1, planLine/Math.max(1, reqLine));
  zs.forEach(o => {
    const z = o.z;
    let eta = (14 + cf*95*z.vuln - (z.crit?6:0)) / Math.pow(Math.min(1, ratio), .75);
    if(S.approved.has('prioritize') && (z.id==='tpa' || z.id==='scc')) eta *= .82;
    if(S.approved.has('reroute') && z.id==='rvv') eta *= .85;
    o.eta = Math.max(12, Math.round(eta));
    if(hs < 0) o.out = S.phase===1 ? Math.round(o.pred*.02*z.vuln) : 0;
    else if(hs >= o.eta) o.out = Math.round(o.pred*.008);
    else { const p = Math.max(0, (hs-10)/(o.eta-10)); o.out = Math.round(o.pred*.9*(1-Math.pow(p,.8))); }
    o.restored = hs >= o.eta;
    o.crews = Math.round(planLine * o.pred / predTotal);
    o.etaDate = addH(LANDFALL, o.eta);
    o.pctPred = o.pred / z.cust;
    o.pctOut = o.out / z.cust;
  });
  const outNow = sum(zs, o=>o.out);
  const avgEta = sum(zs, o=>o.eta*o.pred) / predTotal;
  const p95 = Math.max(...zs.map(o=>o.eta));
  const conf = Math.round(Math.min(95, 70 + S.phase*5 + (ratio>=.95?5:0) - (cat-3)*3));
  const restoredPct = hs <= 0 ? 0 : 1 - outNow / Math.max(1, sum(zs, o=>o.pred*.9));
  const critAtRisk = FACILITIES.filter(f => { const o = zs.find(x=>x.z.id===f.zone); return o.pctPred > .2; }).length;
  const liftAtRisk = Math.round(412*Math.min(.6, cf*1.1));
  const gensNeeded = Math.round(liftAtRisk*.6);
  return {cat, cf, ph, hs, zs, predTotal, reqLine, reqTree, reqDA, INT, mutualReq, treeReq, daReq,
          onLine, onTree, onDA, planLine, ratio, outNow, avgEta, p95, conf, restoredPct, critAtRisk,
          liftAtRisk, gensNeeded, ma};
}

function readiness(){
  const prep = ['mutual','stage','comms','medical','generators','materials','eoc'];
  return Math.min(98, 46 + prep.filter(a=>S.approved.has(a)).length*7 + (S.phase>=1?4:0));
}

/* Feeders — power-law distribution gives the 80/20 Pareto shape */
function feeders(m){
  const order = m.zs.slice().sort((a,b)=>b.pred-a.pred);
  const raw = Array.from({length:40}, (_, i) => 1/Math.pow(i+1, 1.38));
  const tot = sum(raw, x=>x);
  const counters = {};
  return raw.map((r, i) => {
    const o = order[i % order.length];
    counters[o.z.code] = (counters[o.z.code]||0) + 1;
    return {name:`FDR-${o.z.code}-${String(counters[o.z.code]).padStart(2,'0')}`, zone:o.z.short, cust:Math.round(m.predTotal*r/tot)};
  });
}

/* ===================================================================
   CHARTS (inline SVG)
   =================================================================== */
function lineChart(series, labels, opts={}){
  const w = opts.w || 860, h = opts.h || 200, pl = 40, pb = 22, pt = 12;
  const max = opts.max || Math.max(1, ...series.flatMap(s => s.data.filter(v=>v!=null))) * 1.12;
  const x = i => pl + i * ((w - pl - 10) / Math.max(1, labels.length - 1));
  const y = v => pt + (h - pt - pb) * (1 - v / max);
  const grid = [0,.25,.5,.75,1].map(f => {
    const gy = pt + (h-pt-pb)*f;
    return `<line x1="${pl}" y1="${gy}" x2="${w-10}" y2="${gy}" stroke="#14204a"/><text x="${pl-7}" y="${gy+3}" text-anchor="end" fill="#4d5a86" font-size="9" font-family="Poppins">${opts.yfmt ? opts.yfmt(max*(1-f)) : Math.round(max*(1-f))}</text>`;
  }).join('');
  const vline = opts.vline != null ? `<line x1="${x(opts.vline)}" y1="${pt}" x2="${x(opts.vline)}" y2="${h-pb}" stroke="#f5a623" stroke-dasharray="3 3"/><text x="${x(opts.vline)+4}" y="${pt+9}" fill="#f0d7a8" font-size="9" font-family="Poppins">${opts.vlabel||'Now'}</text>` : '';
  const hline = opts.hline != null ? `<line x1="${pl}" y1="${y(opts.hline)}" x2="${w-10}" y2="${y(opts.hline)}" stroke="#e0506a" stroke-dasharray="4 3"/><text x="${w-12}" y="${y(opts.hline)-4}" text-anchor="end" fill="#ffb3c2" font-size="9" font-family="Poppins">${opts.hlabel||''}</text>` : '';
  const paths = series.map(s => {
    const pts = s.data.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    if(!pts.length) return '';
    const d = pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const area = s.fill ? `<path d="${d} L${pts[pts.length-1][0]},${h-pb} L${pts[0][0]},${h-pb} Z" fill="${s.fill}"/>` : '';
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-dasharray="${s.dash||''}" stroke-linejoin="round"/>`;
  }).join('');
  const xl = labels.map((l,i)=>l?`<text x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="middle" fill="#5d6a94" font-size="9" font-family="Poppins">${l}</text>`:'').join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${grid}${hline}${paths}${vline}${xl}</svg>`;
}

function paretoChart(fd){
  const w = 1400, h = 260, pl = 46, pr = 40, pb = 40, pt = 12;
  const max = fd[0].cust * 1.1, tot = sum(fd, f=>f.cust);
  const bw = (w-pl-pr)/fd.length;
  let cum = 0;
  const cumPts = fd.map((f,i)=>{ cum += f.cust; return [pl+i*bw+bw/2, pt+(h-pt-pb)*(1-cum/tot)]; });
  const cut = Math.round(fd.length*.2);
  const bars = fd.map((f,i)=>{
    const bh = (h-pt-pb)*f.cust/max;
    return `<rect x="${(pl+i*bw+bw*.15).toFixed(1)}" y="${(h-pb-bh).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${i<cut?'#e0506a':'#24356e'}"><title>${f.name} · ${f.zone} · ${fmt(f.cust)} customers</title></rect>`
      + (i<cut ? `<text transform="translate(${(pl+i*bw+bw/2).toFixed(1)},${h-pb+8}) rotate(50)" fill="#8a96c0" font-size="9" font-family="Poppins">${f.name}</text>` : '');
  }).join('');
  const cutX = pl + cut*bw;
  const cumAtCut = sum(fd.slice(0,cut), f=>f.cust)/tot;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    ${[0,.5,1].map(f=>`<line x1="${pl}" y1="${pt+(h-pt-pb)*f}" x2="${w-pr}" y2="${pt+(h-pt-pb)*f}" stroke="#14204a"/><text x="${pl-6}" y="${pt+(h-pt-pb)*f+3}" text-anchor="end" fill="#4d5a86" font-size="9" font-family="Poppins">${fmt(max*(1-f))}</text><text x="${w-pr+5}" y="${pt+(h-pt-pb)*f+3}" fill="#c3b1ff" font-size="9" font-family="Poppins">${Math.round(100*(1-f))}%</text>`).join('')}
    <rect x="${pl}" y="${pt}" width="${cutX-pl}" height="${h-pt-pb}" fill="rgba(224,80,106,.06)"/>
    ${bars}
    <path d="${cumPts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}" fill="none" stroke="#c3b1ff" stroke-width="2"/>
    <line x1="${cutX}" y1="${pt}" x2="${cutX}" y2="${h-pb}" stroke="#f5a623" stroke-dasharray="3 3"/>
    <text x="${cutX+6}" y="${pt+12}" fill="#f0d7a8" font-size="10" font-family="Poppins" font-weight="600">Top 20% of feeders → ${Math.round(cumAtCut*100)}% of impact</text>
  </svg>`;
}

function donut(p, color, label, sub, size=96){
  const r = 34, c = 2*Math.PI*r;
  return `<svg viewBox="0 0 90 90" style="width:${size}px;height:${size}px;flex:none">
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="#12224f" stroke-width="10"/>
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c*p/100).toFixed(1)} ${c}" transform="rotate(-90 45 45)"/>
    <text x="45" y="45" text-anchor="middle" fill="#eaf0ff" font-size="17" font-weight="600" font-family="Poppins">${label}</text>
    <text x="45" y="58" text-anchor="middle" fill="#7c88b2" font-size="7.5" font-family="Poppins">${sub}</text></svg>`;
}

function kpi(k, v, cls, s, nav){
  return `<div class="tile kpi${nav?' clickable':''}"${nav?` data-nav="${nav}"`:''}><div class="k">${k}</div><div class="v num ${cls||''}">${v}</div><div class="s">${s||''}</div></div>`;
}

let MAPS = [];
function clearMaps(){ MAPS.forEach(m=>{ try{ m.remove(); }catch(e){} }); MAPS = []; }

function makeMap(id, opts={}){
  const el = document.getElementById(id);
  if(!el) return null;
  if(!window.L){ el.innerHTML = svgFallbackMap(opts); return null; }
  const m = L.map(el, {zoomControl:true, scrollWheelZoom:false, attributionControl:true}).setView(opts.center || [27.94,-82.38], opts.zoom || 10);
  // Esri canvas basemaps — free, no API key, work from file:// as well as https://
  const tone = opts.light ? 'Light' : 'Dark';
  const esri = s => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${tone}_Gray_${s}/MapServer/tile/{z}/{y}/{x}`;
  const base = L.tileLayer(esri('Base'), {attribution:'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap', maxZoom:16}).addTo(m);
  L.tileLayer(esri('Reference'), {maxZoom:16, opacity:.8}).addTo(m);
  let failed = 0;
  base.on('tileerror', () => {
    if(++failed === 6){ // provider unreachable → fall back to OpenStreetMap
      m.removeLayer(base);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap contributors', maxZoom:19, className:opts.light?'':'osm-dark'}).addTo(m).bringToBack();
    }
  });
  if(S.owKey && S.radar && opts.radar){
    L.tileLayer(`https://tile.openweathermap.org/map/${S.owLayer}/{z}/{x}/{y}.png?appid=${encodeURIComponent(S.owKey)}`, {opacity:.75, attribution:'Weather © OpenWeather'}).addTo(m);
  }
  MAPS.push(m);
  setTimeout(()=>m.invalidateSize(), 60);
  return m;
}

function addZones(map, m, mode, noLabels){

  m.zs.forEach(o=>{
    const v = mode==='pred' ? o.pctPred : (S.phase<2 ? o.pctPred : o.pctOut);

    const c = L.circle([o.z.lat, o.z.lng], {radius:Math.sqrt(o.z.cust)*15, color:col, weight:1.5, fillColor:col, fillOpacity:.32}).addTo(map);

function svgFallbackMap(){
  const m = M(), W = 800, H = 430, b = {n:28.25, s:27.62, w:-82.75, e:-82.0};
  const px = (lat,lng) => [ (lng-b.w)/(b.e-b.w)*W, (b.n-lat)/(b.n-b.s)*H ];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;background:#071027">
    <path d="M0 ${H*.55} Q ${W*.25} ${H*.5} ${W*.33} ${H*.62} L ${W*.38} ${H} L 0 ${H} Z" fill="#0b1d45"/>
    ${m.zs.map(o=>{ const [x,y]=px(o.z.lat,o.z.lng); const r=Math.sqrt(o.z.cust)/13; const col=sevColor(S.phase<2?o.pctPred:o.pctOut);
      return `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" fill-opacity=".35" stroke="${col}"/><text x="${x}" y="${y+3}" text-anchor="middle" fill="#eaf0ff" font-size="10" font-family="Poppins">${o.z.short}</text>`; }).join('')}

}

   =================================================================== */
const TPA = {lat:27.9506, lon:-82.4572};
const WMO = {0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',80:'Rain showers',81:'Rain showers',82:'Violent showers',95:'Thunderstorm',96:'Thunderstorm, hail',99:'Thunderstorm, hail'};

async function fetchWeather(){
  try{
    if(S.owKey){
      const k = encodeURIComponent(S.owKey);
      const [cur, fc] = await Promise.all([
        fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${TPA.lat}&lon=${TPA.lon}&units=imperial&appid=${k}`).then(r=>{ if(!r.ok) throw new Error('OpenWeather '+r.status); return r.json(); }),
        fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${TPA.lat}&lon=${TPA.lon}&units=imperial&appid=${k}`).then(r=>r.ok?r.json():null)
      ]);
      S.wx = {src:'OpenWeather', temp:cur.main.temp, hum:cur.main.humidity, press:cur.main.pressure, wind:cur.wind.speed, gust:cur.wind.gust||cur.wind.speed,
        desc:cur.weather[0].description.replace(/^./, c=>c.toUpperCase()), at:new Date(),
        hourly: fc ? fc.list.slice(0,16).map(i=>({t:new Date(i.dt*1000), gust:i.wind.gust||i.wind.speed, pop:Math.round((i.pop||0)*100)})) : []};
    } else {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${TPA.lat}&longitude=${TPA.lon}&current=temperature_2m,relative_humidity_2m,pressure_msl,wind_speed_10m,wind_gusts_10m,weather_code&hourly=wind_gusts_10m,precipitation_probability&wind_speed_unit=mph&temperature_unit=fahrenheit&forecast_days=3&timezone=America%2FNew_York`;
      const d = await fetch(url).then(r=>{ if(!r.ok) throw new Error('Open-Meteo '+r.status); return r.json(); });
      const c = d.current, now = Date.now();
      const hourly = d.hourly.time.map((t,i)=>({t:new Date(t), gust:d.hourly.wind_gusts_10m[i], pop:d.hourly.precipitation_probability[i]})).filter(x=>x.t.getTime() >= now-3600e3).filter((_,i)=>i%3===0).slice(0,16);
      S.wx = {src:'Open-Meteo', temp:c.temperature_2m, hum:c.relative_humidity_2m, press:c.pressure_msl, wind:c.wind_speed_10m, gust:c.wind_gusts_10m, desc:WMO[c.weather_code]||'—', at:new Date(), hourly};
    }
    $('#wxTagTxt').textContent = `Tampa ${Math.round(S.wx.temp)}°F · wind ${Math.round(S.wx.wind)} mph`;
    $('#wxTag').title = 'Live weather via ' + S.wx.src;
  } catch(e){
    S.wx = {err:String(e.message||e)};
    $('#wxTagTxt').textContent = 'Live weather unavailable';
  }
  if(S.screen==='storm' || S.screen==='settings') refresh();
}

SCREENS.restore = function(){
  const m = M(), pre = S.phase < 2;
  const hours = Array.from({length:25}, (_,i)=>i*3);
  const curve = hours.map(h => {
    const restored = sum(m.zs, o => { if(h>=o.eta) return o.pred; const p = Math.max(0,(h-10)/(o.eta-10)); return o.pred*Math.pow(p,.8); });
    return Math.round(restored / m.predTotal * 100);
  });
  const nowIdx = m.hs >= 0 ? Math.min(24, m.hs/3) : null;
  const actual = nowIdx==null ? [] : curve.map((v,i)=> i<=nowIdx ? Math.max(0, v - (i>2?Math.round(3*Math.sin(i)):0)) : null);
  return `<div class="stack">
    <div class="kpis">
      ${kpi(pre?'Predicted peak out':'Customers out now', fmt(pre?m.predTotal:m.outNow), 'neg', pre?'forecast':'live from OMS / AMI')}
      ${kpi('Restored', pre?'—':pct(m.restoredPct), 'pos', pre?'restoration starts after all-clear':'of affected customers')}
      ${kpi('Avg AI ETR', Math.round(m.avgEta)+' h', 'aic', 'after landfall, customer-weighted')}
      ${kpi('95% restored by', fmtT(addH(LANDFALL,m.p95)), '', fmtDT(addH(LANDFALL,m.p95)).split(',')[1])}
      ${kpi('ETR confidence', m.conf+'%', 'aic', 'improves as damage is assessed')}
      ${kpi('Published to website', S.pubZones.size+' / '+ZONES.length, S.pubZones.size?'pos':'warnc', S.pubZones.size?'customers see exact times':'not published', 'portal')}
    </div>
    <div class="card">
      <div class="card-h"><h3>Restoration curve</h3><span class="hint">% of affected customers restored · hours after landfall</span><div style="flex:1"></div>
        <div class="legend"><span><i class="sw" style="background:#7c5cf0"></i>AI forecast</span><span><i class="sw" style="background:#3ec46d"></i>Actual</span></div></div>
      <div class="card-b">${lineChart([{data:curve, color:'#7c5cf0', w:2, dash:'5 3', fill:'rgba(124,92,240,.07)'},{data:actual, color:'#3ec46d', w:2.6}], hours.map(h=>h%12===0?'+'+h+'h':''), {max:100, yfmt:v=>Math.round(v)+'%', vline:nowIdx, vlabel:PH[S.phase].short, w:1400, h:240})}</div>
    </div>
    <div class="card">
      <div class="card-h"><h3>AI estimated restoration time by zone</h3><span class="hint">replaces "multiple days" with a specific, explainable time</span><div style="flex:1"></div>
        ${S.phase>=3 ? (S.pubZones.size===ZONES.length ? '<span class="tag tag-ok">All zones published ✓</span>' : `<button class="btn btn-primary btn-sm" data-approve="publish">Publish all to website + SMS</button>`) : `<span class="tag tag-warn">Publishing unlocks after damage assessment (T+24h)</span>`}
      </div>
      <table class="tbl"><thead><tr><th>Zone</th><th class="n">Customers out</th><th class="n">Line workers</th><th>AI ETR</th><th class="n">Confidence</th><th>Drivers</th><th>Website</th></tr></thead><tbody>
        ${m.zs.slice().sort((a,b)=>a.eta-b.eta).map(o=>{ const conf = Math.max(55, m.conf - Math.round(o.z.vuln*8) + (o.restored?10:0)); const pub = S.pubZones.has(o.z.id);
          return `<tr><td>${o.z.name}</td><td class="n">${fmt(pre?o.pred:o.out)}${pre?'<span class="muted" style="font-size:9.5px"> pred.</span>':''}</td><td class="n">${fmt(o.crews)}</td>
          <td>${o.restored?'<span class="tag tag-ok">Restored</span>':`<b style="color:var(--t1)">${fmtDT(o.etaDate)}</b>`}</td>
          <td class="n"><span class="${conf>=85?'pos':conf>=70?'warnc':'neg'}">${Math.min(99,conf)}%</span></td>
          <td class="muted" style="font-size:10.5px">${o.z.coastal?'Surge damage, ':'Wind/tree damage, '}${o.crews} line workers${o.z.crit?', hospital priority':''}${o.z.med?', medical-needs priority':''}</td>
          <td>${S.phase>=3 ? `<button class="switch${pub?' on':''}" data-pub="${o.z.id}" title="Publish ETR to website"></button>` : '<span class="muted" style="font-size:10px">—</span>'}</td></tr>`; }).join('')}
      </tbody></table>
      <div class="card-b">${why(`Each ETR = remaining customers out ÷ (crews assigned × live restoration rate), adjusted for damage type (surge damage takes ~2.3× longer than wind damage), access (flooded roads), and priority rules (hospitals, water plants, medical-needs customers first). It updates every 15 minutes from OMS, AMI and crew GPS. Policy: a human must approve before ETRs go public.`)}</div>
    </div>
  </div>`;
};

function zoneIn(q){ return ZONES.find(z => q.includes(z.short.toLowerCase()) || q.includes(z.id) || (z.id==='tnc' && q.includes('town and country'))); }
function answer(raw){
  const q = raw.toLowerCase(), m = M(), sn = stormNow(), pre = S.phase < 2;
  const z = zoneIn(q);
  const catMatch = q.match(/cat(?:egory)?\s*([1-5])/);
  // scenario
  if(catMatch && /what if|if it|becomes|scenario|upgrade|stronger|worse|instead/.test(q) || /what if/.test(q) && catMatch){
    const c = Number(catMatch[1]), m2 = M(c);
    return {html:`If Kyle makes landfall as a <b>Category ${c}</b> instead of ${S.cat}:<ul>
      <li>Predicted outages: <b>${fmt(m2.predTotal)}</b> (${m2.predTotal>m.predTotal?'+':''}${fmt(m2.predTotal-m.predTotal)})</li>
      <li>Line workers needed: <b>${fmt(m2.reqLine)}</b> — mutual aid request becomes ${fmt(m2.mutualReq)}</li>
      <li>95% restored by <b>${fmtDT(addH(LANDFALL,m2.p95))}</b></li>
      <li>Storm surge: ${SURGE_BY_CAT[c]}</li></ul>`,
      acts:[[`Switch scenario to Cat ${c}`, `__cat${c}`]],
      say:`At category ${c}, about ${fmt(m2.predTotal)} customers would lose power and we would need ${fmt(m2.reqLine)} line workers.`};
  }
  if(/(more|enough|how many).*(people|crew|worker|line|staff|resource)|mutual aid|staff|do i need/.test(q) && !/water/.test(q)){
    const have = pre ? m.planLine : m.onLine, gap = m.reqLine - have;
    return {html: gap>0 ? `<b>Yes — you need more people.</b> For a Cat ${m.cat} landfall the model needs <b>${fmt(m.reqLine)}</b> line workers; you ${pre?'have committed':'have on hand'} <b>${fmt(have)}</b>. That's a gap of <b>${fmt(gap)}</b>.<ul><li>Request ${fmt(m.mutualReq)} mutual-aid line workers + ${fmt(m.treeReq)} tree workers now</li><li>They need 36–60 h to arrive — landfall is ${fmtT(LANDFALL)}</li><li>Without them, 95% restoration slips to <b>${fmtDT(addH(LANDFALL,m.p95))}</b></li></ul>`
      : `<b>You're covered.</b> ${fmt(have)} line workers against a requirement of ${fmt(m.reqLine)}. 95% of customers should be restored by <b>${fmtDT(addH(LANDFALL,m.p95))}</b>.`,
      acts: gap>0 && !S.approved.has('mutual') && S.phase<3 ? [['Request mutual aid','mutual'],['Open crew plan','__nav:crews']] : [['Open crew plan','__nav:crews']],
      say: gap>0 ? `Yes. You need ${fmt(m.reqLine)} line workers and have ${fmt(have)}. I recommend requesting ${fmt(m.mutualReq)} mutual aid workers now.` : `You're covered. ${fmt(have)} line workers are available.`};
  }
  if(/hospital|critical|facilit|shelter|medical/.test(q)){
    return {html:`<b>${m.critAtRisk} critical facilities</b> are in high-risk zones:<ul>${FACILITIES.filter(f=>m.zs.find(x=>x.z.id===f.zone).pctPred>.2).map(f=>`<li>${f.n} — ${f.feeder}, backup ${f.backup}</li>`).join('')}</ul>Tampa General's feeder is ranked #1 for restoration. 1,240 medical-needs customers ${S.approved.has('medical')?'have been contacted ✓':'<b>have not been contacted yet</b>'}.`,
      acts: S.approved.has('medical') ? [] : [['Contact medical-needs customers','medical']],
      say:`${m.critAtRisk} critical facilities are at risk, including Tampa General Hospital, which is first in the restoration queue.`};
  }
  if(/water|lift|boil|sewer/.test(q)){
    return {html:`Water system outlook (Cat ${m.cat}): <b>${m.liftAtRisk}</b> of 412 lift stations are in predicted outage areas without backup power. I recommend <b>${m.gensNeeded} portable generators</b>. ${m.cat>=3?`Coastal zones (${m.zs.filter(o=>o.z.coastal).map(o=>o.z.short).join(', ')}) may need precautionary boil-water notices — templates are ready.`:'No boil-water notices expected.'}`,
      acts: S.approved.has('generators') ? [] : [['Deploy generators','generators']], say:`${m.liftAtRisk} lift stations are at risk. I recommend deploying ${m.gensNeeded} generators.`};
  }
  if(/post|tweet|draft|social|facebook|announce|message|text customers|sms/.test(q)){
    const T = templates(m);
    let txt = T.x;
    if(z && S.phase>=2){ const o = m.zs.find(x=>x.z.id===z.id); txt = `Update for ${z.short}: ${o.restored?'power has been restored. Still out? Text OUT to 72990.':`${fmt(o.out)} customers are out. ${o.crews} line workers are assigned. Estimated restoration: ${fmtDT(o.etaDate)}.`} Details → bayviewpw.example/outages #KyleFL`; }
    return {html:`Here's a draft for X:<div class="txt" style="margin-top:6px;background:#081230;border:1px solid var(--rule);border-radius:7px;padding:8px 10px;white-space:pre-wrap">${esc(txt)}</div>`,
      acts:[['Open campaign','__nav:comms']], say:`I've drafted a post${z?' for '+z.short:''}. You can review it in communications.`};
  }
  if(/when|restor|etr|back on|power back|how long/.test(q)){
    if(z){ const o = m.zs.find(x=>x.z.id===z.id);
      return {html: o.restored ? `<b>${z.short}</b> was restored at ${fmtDT(o.etaDate)}.` : `<b>${z.short}</b>: ${pre?`predicted ${fmt(o.pred)} customers out (${pct(o.pctPred)})`:`${fmt(o.out)} customers out`}. AI estimated restoration: <b>${fmtDT(o.etaDate)}</b> (${o.eta} h after landfall), ${o.crews} line workers assigned.${o.z.coastal?' Surge damage slows this zone.':''}`,
        acts:[['See all ETRs','__nav:restore']], say: o.restored ? `${z.short} is already restored.` : `${z.short} should be restored by ${fmtDT(o.etaDate)}.`};
    }
    return {html:`Average AI restoration: <b>${Math.round(m.avgEta)} hours</b> after landfall. 95% of customers restored by <b>${fmtDT(addH(LANDFALL,m.p95))}</b>.<ul>${m.zs.slice().sort((a,b)=>a.eta-b.eta).slice(0,3).map(o=>`<li>Fastest: ${o.z.short} — ${fmtT(o.etaDate)}</li>`).join('')}${m.zs.slice().sort((a,b)=>b.eta-a.eta).slice(0,2).map(o=>`<li>Slowest: ${o.z.short} — ${fmtT(o.etaDate)}</li>`).join('')}</ul>`,
      acts:[['See all ETRs','__nav:restore']], say:`On average, power will be back ${Math.round(m.avgEta)} hours after landfall. 95 percent by ${fmtDT(addH(LANDFALL,m.p95))}.`};
  }
  if(/worst|hardest|most affected|which (area|zone|neighbo)|where.*(out|impact)/.test(q)){
    const t = m.zs.slice().sort((a,b)=>pre?b.pred-a.pred:b.out-a.out).slice(0,3);
    return {html:`Hardest hit ${pre?'(predicted)':'(right now)'}:<ul>${t.map(o=>`<li><b>${o.z.short}</b> — ${fmt(pre?o.pred:o.out)} customers (${pct(pre?o.pctPred:o.pctOut)})${o.z.coastal?' · surge zone':''}</li>`).join('')}</ul>`,
      acts:[['Open prediction map','__nav:predict']], say:`The hardest hit areas are ${t.map(o=>o.z.short).join(', ')}.`};
  }
  if(/cost|budget|spend|money/.test(q)){
    const cost = m.mutualReq*4200*Math.max(3,m.avgEta/24) + m.predTotal*38;
    return {html:`Estimated storm cost: <b>$${(cost/1e6).toFixed(1)}M</b><ul><li>Mutual-aid crews: $${(m.mutualReq*4200*Math.max(3,m.avgEta/24)/1e6).toFixed(1)}M (${fmt(m.mutualReq)} workers × ~$4,200/day)</li><li>Materials & logistics: $${(m.predTotal*38/1e6).toFixed(1)}M</li></ul>Typically eligible for storm-cost recovery filing.`, acts:[], say:`The estimated storm cost is ${(cost/1e6).toFixed(1)} million dollars.`};
  }
  if(/weather|wind|landfall|where.*storm|rain|surge|track|kyle/.test(q)){
    const w = S.wx && !S.wx.err ? ` Live conditions in Tampa right now (${S.wx.src}): ${Math.round(S.wx.temp)}°F, wind ${Math.round(S.wx.wind)} mph, gusts ${Math.round(S.wx.gust)} mph.` : '';
    return {html:`<b>Hurricane Kyle</b> — ${sn.label}${sn.wind?`, ${sn.wind} mph`:''}, ${sn.dist}. ${S.phase<2?`Landfall forecast ${fmtDT(LANDFALL)} as Cat ${S.cat} with ${SURGE_BY_CAT[S.cat]} surge.`:PH[S.phase].status+'.'}${w}`,
      acts:[['Open storm view','__nav:storm']], say:`Hurricane Kyle is ${sn.label}, ${sn.dist}.`};
  }
  if(/how many|customers out|outage|affected/.test(q)){
    return {html: pre ? `No outages yet. The model predicts a peak of <b>${fmt(m.predTotal)}</b> customers (${pct(m.predTotal/TOTAL_CUST)}) about 3 hours after landfall.` : `<b>${fmt(m.outNow)}</b> customers are out right now. ${pct(m.restoredPct)} of affected customers have been restored.`,
      acts:[], say: pre ? `We predict ${fmt(m.predTotal)} customers will lose power.` : `${fmt(m.outNow)} customers are currently out.`};
  }
  if(/report|after.action|summary for|regulator|psc/.test(q)){
    return {html:`After-action draft ready:<ul><li>Peak outages: ${fmt(m.predTotal*.9)}</li><li>Line workers deployed: ${fmt(m.onLine)}</li><li>Avg ETR error: ±2.1 h</li><li>Messages sent: ${fmt(TOTAL_CUST*3.4)}</li><li>Decisions logged: ${S.approved.size}</li></ul>`, acts:[], say:'The after action report draft is ready.'};
  }
  if(/what (should|do) (we|i)|priorit|brief|status|summar|first|next|update me|situation/.test(q)){
    const p = pendingActions().slice(0,3);
    return {html:`<b>Situation — ${PH[S.phase].short} ${PH[S.phase].label}.</b> ${PH[S.phase].status}. ${pre?`Predicted peak ${fmt(m.predTotal)} customers out.`:`${fmt(m.outNow)} customers out, ${pct(m.restoredPct)} restored.`} Readiness ${readiness()}%.<br>${p.length?`Top priorities:<ul>${p.map(a=>`<li>${a.title(m)}</li>`).join('')}</ul>`:'All recommended actions for this phase are done. ✓'}`,
      acts: p.slice(0,2).map(a=>['Approve: '+stripTags(a.title(m)).slice(0,38)+'…', a.id]),
      say: p.length ? `Your top priority is: ${stripTags(p[0].title(m))}.` : 'All recommended actions for this phase are complete.'};
  }
  return {html:`I can help with crews, restoration times, hardest-hit areas, critical facilities, water, costs, scenarios and customer messages. Try:<ul><li>"Do I need more people?"</li><li>"When will Riverview be restored?"</li><li>"What if Kyle becomes a Cat 4?"</li><li>"Draft a post for Brandon customers"</li></ul>`, acts:[], say:'Here are some things you can ask me.'};
}

function ask(q){
  q = (q||'').trim(); if(!q) return;
  S.chat.push({who:'me', html:esc(q)});
  const a = answer(q);
  S.chat.push({who:'ai', html:a.html, acts:a.acts});
  renderChats();
  if(S.voice) speak(a.say || stripTags(a.html));
}
function chatHtml(limit){
  const list = limit ? S.chat.slice(-limit) : S.chat;
  return list.map(c=>`<div class="msg ${c.who}">${c.html}${c.acts&&c.acts.length?`<div class="act">${c.acts.map(([l,id])=>id.startsWith('__nav:')?`<button class="btn btn-sm" data-nav="${id.slice(6)}">${esc(l)}</button>`:id.startsWith('__cat')?`<button class="btn btn-sm btn-ai" data-setcat="${id.slice(5)}">${esc(l)}</button>`:S.approved.has(id)?'<span class="tag tag-ok">Approved ✓</span>':`<button class="btn btn-sm btn-primary" data-approve="${id}">${esc(l)}</button>`).join('')}</div>`:''}</div>`).join('');
}
function renderChats(){
  ['#miniChat','#bigChat'].forEach(sel=>{ const el = $(sel); if(el){ el.innerHTML = chatHtml(sel==='#miniChat'?4:0); el.scrollTop = el.scrollHeight; } });
}
document.addEventListener('click', e=>{ const c = e.target.closest('[data-setcat]'); if(c){ S.cat = Number(c.dataset.setcat); toast(`Scenario → Cat ${S.cat}`, 'ai'); refresh(); } });

const chatInput = id => `<div style="display:flex;gap:8px;align-items:center">
  <input class="field" id="${id}In" placeholder="Ask Jarvis… e.g. 'Do I need more crews?'" autocomplete="off">
  <button class="mic" id="${id}Mic" title="Talk to Jarvis">${icon('mic','ic','width:17px;height:17px')}</button>
  <button class="btn btn-ai" id="${id}Send" style="height:40px">${icon('send')}</button></div>`;

function wireChat(id){
  const inp = $('#'+id+'In'); if(!inp) return;
  const send = () => { const v = inp.value; inp.value = ''; ask(v); };
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
  $('#'+id+'Send').addEventListener('click', send);
  $('#'+id+'Mic').addEventListener('click', ()=>listen(id));
  const el = $(id==='mini'?'#miniChat':'#bigChat'); if(el) el.scrollTop = el.scrollHeight;
}
function listen(id){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Voice input needs Chrome or Edge. You can type instead.', 'info'); return; }
  const btn = $('#'+id+'Mic');
  const r = new SR(); r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 1;
  btn.classList.add('rec');
  r.onresult = e => { const t = Array.from(e.results).map(x=>x[0].transcript).join(''); const inp = $('#'+id+'In'); if(inp) inp.value = t; if(e.results[e.results.length-1].isFinal){ const inp2 = $('#'+id+'In'); if(inp2) inp2.value=''; ask(t); } };
  r.onerror = e => { toast('Voice: '+e.error, 'info'); };
  r.onend = () => { const b = $('#'+id+'Mic'); if(b) b.classList.remove('rec'); };
  r.start();
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = speechSynthesis.getVoices().find(v=>/en-GB/.test(v.lang) && /male|daniel|george|arthur/i.test(v.name)) || speechSynthesis.getVoices().find(v=>/en-(GB|US)/.test(v.lang));
  if(v) u.voice = v;
  u.rate = 1.03; u.pitch = .95;
  u.onstart = () => { const o = $('#orb'); if(o) o.classList.add('talk'); };
  u.onend = () => { const o = $('#orb'); if(o) o.classList.remove('talk'); };
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

  const wx = S.wx;
  return `<div class="grid2">
    <div class="card">
      <div class="card-h"><h3>Weather data</h3><div style="flex:1"></div>${wx&&!wx.err?`<span class="livetag"><i></i>${wx.src} connected</span>`:'<span class="tag tag-warn">Not connected</span>'}</div>
      <div class="card-b stack" style="gap:11px">
        <div class="muted" style="font:300 11px/1.7 Poppins">Without a key, OMS360 uses the free, keyless <b style="color:var(--t2)">Open-Meteo</b> feed for live Tampa conditions. Add a free <b style="color:var(--t2)">OpenWeather</b> API key (openweathermap.org → API keys) to switch to OpenWeather and unlock live radar, wind and cloud map overlays.</div>
        <div><div class="sec-label" style="margin-bottom:6px">OpenWeather API key</div>
          <div style="display:flex;gap:8px"><input class="field" id="owKey" type="password" placeholder="Paste your OpenWeather API key" value="${esc(S.owKey)}"><button class="btn btn-primary" id="owSave">Save & test</button>${S.owKey?'<button class="btn" id="owClear">Remove</button>':''}</div></div>
        ${wx&&wx.err?`<div class="tag tag-bad" style="white-space:normal">${esc(wx.err)} — new OpenWeather keys can take up to 2 hours to activate.</div>`:''}
        ${wx&&!wx.err?`<div class="muted" style="font:300 10.5px Poppins">Last reading: ${Math.round(wx.temp)}°F, ${esc(wx.desc)}, wind ${Math.round(wx.wind)} mph · ${wx.at.toLocaleTimeString()}</div>`:''}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>Integrations</h3></div>
      <div class="card-b stack" style="gap:9px">
        ${[['Outage Management System (OMS)','Connected'],['AMI / smart meters (last-gasp)','Connected'],['GIS — feeders, poles, assets','Connected'],['Crew GPS / mobile workforce','Connected'],['Public website & outage map','Connected'],['X & Facebook','Connected'],['SMS gateway','Connected'],['IVR','Connected'],['Regional mutual-aid group portal','Connected'],['NHC advisories','Simulated (demo)']]
          .map(([n,s])=>`<div style="display:flex;justify-content:space-between;align-items:center"><span style="font:400 11.5px Poppins;color:var(--t2)">${n}</span><span class="tag ${s==='Connected'?'tag-ok':'tag-warn'}">${s}</span></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>AI policy</h3></div>
      <div class="card-b stack" style="gap:10px">
        ${[['Human approval before publishing ETRs to website','On'],['Human approval before social posts','On'],['Automated SMS on outage / restore events','On'],['Auto-release crews when winds < 39 mph','On'],['ETR refresh interval','15 min'],['Jarvis may approve actions by voice','Off']]
          .map(([n,v])=>`<div style="display:flex;justify-content:space-between;align-items:center"><span style="font:400 11.5px Poppins;color:var(--t2)">${n}</span><span class="tag ${v==='On'?'tag-ok':v==='Off'?'tag-bad':'tag-sk'}">${v}</span></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>Demo controls</h3></div>
      <div class="card-b stack" style="gap:10px">
        <div class="muted" style="font:300 11px Poppins">Reset the walkthrough before presenting.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-warn" id="resetDemo">Reset demo</button><button class="btn" id="prepDemo">Jump to T+24h with prep approved</button></div>
      </div>
    </div>
  </div>`;
};
WIRE.settings = function(){
  $('#owSave').addEventListener('click', ()=>{ S.owKey = $('#owKey').value.trim(); store.set('oms360_owkey', S.owKey); S.radar = !!S.owKey; S.wx = null; toast('Testing weather connection…', 'info'); fetchWeather(); });
  const c = $('#owClear'); if(c) c.addEventListener('click', ()=>{ S.owKey=''; store.set('oms360_owkey',''); S.radar=false; S.wx=null; fetchWeather(); refresh(); });
  $('#resetDemo').addEventListener('click', ()=>{ stopPlay(); S.phase=0; S.cat=3; S.approved.clear(); S.dismissed.clear(); S.published=false; S.pubZones.clear(); S.commsApproved.clear(); S.portalZone=null; S.chat=[greeting()]; toast('Demo reset to T-72h.'); navigate('command'); });
  $('#prepDemo').addEventListener('click', ()=>{ ['mutual','stage','comms','medical','generators','materials','eoc','shelter','assess'].forEach(a=>S.approved.add(a)); ['prep','pre'].forEach(k=>CH.forEach(c=>S.commsApproved.add(k+'-'+c.id))); S.phase=3; toast('Jumped to T+24h — preparation approved.'); navigate('restore'); });
};

/* ===================================================================
   BOOT
   =================================================================== */
S.chat = [greeting()];
navigate('command');
fetchWeather();
setInterval(fetchWeather, 10*60*1000);
</script>
</body>
</html>
