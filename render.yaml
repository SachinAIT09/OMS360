# Render Blueprint: one Docker service serves the React UI and the /api backend at the same URL.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: oms360
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENWEATHER_API_KEY   # optional: weather radar layer
        sync: false
      # Signs login tokens. The free plan has no disk, so the database is rebuilt on every restart;
      # a stable secret keeps people signed in across those restarts.
      - key: OMS360_SECRET
        generateValue: true
